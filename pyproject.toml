[project]
name = "dataqualitydecorators"
version = "0.1.0"
description = "Data quanlity decorators as Service API for data pipelines"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
big-data = [
    "pyspark>=4.1.0",
]
database = [
    "sqlalchemy>=2.0.45",
]
jupyter-notebook = [
    "notebook>=7.5.1",
]
package-builder = [
    "build>=1.3.0",
]
test-module = [
    "pytest>=9.0.2",
]
